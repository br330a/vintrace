version: "3.8"

services:
  # Orion Context Broker
  orion:
    image: fiware/orion:3.10.1
    hostname: orion
    container_name: fiware-orion
    depends_on:
      - mongo-db
    networks:
      - default
    ports:
      - "1026:1026"
    command: -dbhost mongo-db -logLevel INFO -corsOrigin __ALL

  # IoT Agent UltraLight 2.0
  iot-agent:
    image: fiware/iotagent-ul:3.4.0
    hostname: iot-agent
    container_name: fiware-iot-agent
    depends_on:
      - mongo-db
      - mosquitto
    networks:
      - default
    ports:
      - "4041:4041"
    environment:
      - IOTA_CB_HOST=orion
      - IOTA_CB_PORT=1026
      - IOTA_NORTH_PORT=4041
      - IOTA_REGISTRY_TYPE=mongodb
      - IOTA_MONGO_HOST=mongo-db
      - IOTA_MONGO_PORT=27017
      - IOTA_MONGO_DB=iotagentul
      - IOTA_MQTT_HOST=mosquitto
      - IOTA_MQTT_PORT=1883
      - IOTA_PROVIDER_URL=http://iot-agent:4041
      - IOTA_DEFAULT_RESOURCE=/iot/d

  # STH-Comet (Histórico de Séries Temporais)
  sth-comet:
    image: fiware/sth-comet:2.11.0
    hostname: sth-comet
    container_name: fiware-sth-comet
    depends_on:
      - mongo-db
    networks:
      - default
    ports:
      - "8666:8666"
    environment:
      - STH_HOST=0.0.0.0
      - STH_PORT=8666
      - DB_URI=mongo-db:27017
      - STH_DEFAULT_SERVICE=smart
      - STH_DEFAULT_SERVICE_PATH=/

  # Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:1.6.14
    hostname: mosquitto
    container_name: fiware-mosquitto
    networks:
      - default
    ports:
      - "1883:1883"
      - "9001:9001"

  # MongoDB
  mongo-db:
    image: mongo:4.4
    hostname: mongo-db
    container_name: fiware-mongodb
    networks:
      - default
    volumes:
      - mongo-db-data:/data/db

volumes:
  mongo-db-data:
